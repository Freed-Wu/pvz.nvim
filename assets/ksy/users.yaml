---
# https://github.com/chiaracoetzee/plants-vs-zombies-user-file-editor/blob/595523add14b649147218bcd059eeb18fe506e92/Plants%20vs.%20Zombies%20user%20file%20editor/FormSelectUser.cs#L111-L125
meta:
  id: users
  file-extension: dat
  endian: le
  encoding: ASCII

seq:
  - id: version
    type: u4
    doc: 版本号，必须为 0x0E

  - id: num_users
    type: u2
    doc: 用户数量

  - id: users
    type: user_entry
    repeat: expr
    repeat-expr: num_users

types:
  user_entry:
    seq:
      - id: len_name
        type: u2
        doc: 用户名长度

      - id: name
        type: str
        size: len_name

      - id: timestamp
        type: u4
        doc: 时间戳

      - id: id
        type: u4
        doc: 文件编号
